<style>
:root{--g:#39FF14;--ln:#5b5e63;--mu:#a3a6ab;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#1d1e21;color:#f2f2f2;font:400 16px/1.4 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}:focus-visible{outline:2px solid var(--g);outline-offset:2px}
.col{max-width:680px;margin:auto}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#1d1e21}
.top{display:flex;align-items:center;gap:14px;padding:12px 7% 12px;border-bottom:1px solid #3a3c40}
.logo{background:none;border:0;padding:0;text-align:left;font-weight:800;font-size:22px;line-height:1;color:#fff;letter-spacing:.02em}
.logo span{display:block;font-weight:400;font-size:19px;color:#cfd0d2;letter-spacing:.04em;margin-top:2px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:#2a2d33;border-radius:99px;padding:0 14px;min-width:0}
.search input{flex:1;min-width:0;background:none;border:0;color:#fff;padding:12px 0;font:inherit}.search input:focus{outline:0}.search:focus-within{box-shadow:0 0 0 1px var(--g)}
.bag{position:relative;background:none;border:0;width:44px;height:44px;display:grid;place-items:center;flex:none}
.bag b{position:absolute;top:0;right:0;background:#6f8f72;color:#fff;border-radius:99px;min-width:19px;height:19px;font-size:11px;display:grid;place-items:center}
nav{display:flex;justify-content:flex-start;gap:2px;overflow-x:auto;padding:6px 8px;scrollbar-width:none}
nav button{background:none;border:0;color:#d7d8da;padding:8px 9px;white-space:nowrap;font-size:clamp(12px,2.6vw,16px);min-height:40px}

const small=(p,c)=>`<article class="c ${c}">${ph(p)}<div class="nm">${p.name}</div><div class="ds">${p.t}</div><div class="row"><span class="pr">${m(p.price)}</span>${soldOut(p.id)?`<button class="b" disabled style="opacity:.45">Agotado</button>`:`<button class="b" data-size="${p.id}">Size</button>`}</div></article>`;
function hero(){const f=P[0];return `<section class="hero"><div class="ov"><article class="c f"><span class="tag">PREMIUM COLLECTION</span>${ph(f)}<div class="nm">${f.name}</div><div class="ds">${f.t}</div><div class="row"><span class="pr">${m(f.price)}</span>${sizes(f)}${soldOut(f.id)?`<button class="b" disabled style="opacity:.45">Agotado</button>`:`<button class="b" data-add="1">Cart</button>`}</div></article>${small(P[1],"s1")}${small(P[2],"s2")}${small(P[3],"s3")}
<a class="pill" href="${wa(WT)}" target="_blank" rel="noopener">Customer Support</a><a class="chatb" href="${wa(WT,"Hola, quiero información de STREET FASHION")}" target="_blank" rel="noopener" aria-label="Escribir por WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a9.5 9.5 0 00-8.1 14.4L2.5 21.5l4.8-1.3A9.5 9.5 0 1012 2.5z" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M8.5 7.8c.3-.5.8-.4 1 .1l.8 1.8c.1.3 0 .6-.3.9l-.5.6c.8 1.6 1.9 2.6 3.5 3.4l.6-.7c.2-.3.6-.3.9-.2l1.8.9c.5.2.5.7.2 1.1-.5.8-1.5 1.2-2.6.9-3-.9-5-2.9-5.9-5.6-.3-1 .1-2 .9-3.3z" fill="#fff"/></svg></a></div></section>`}
const chips=()=>`<div style="display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 12px">${["Todos",...SEC[view]].map(s=>`<button class="b ch${sub==s?" on":""}" data-sub="${s}">${s}</button>`).join("")}</div>`;
const tiles=()=>`<div class="tl">${NAV.slice(1).map(n=>`<button class="b" data-v="${n[0]}">${n[1].replace(/[\[\]]/g,"")}</button>`).join("")}</div>`;
function list(){let l=P.filter(p=>!term||(p.name+p.t+p.cat).toLowerCase().includes(term));
if(!term){l=l.filter(p=>p.sec==view);if(sub!="Todos")l=l.filter(p=>p.cat==sub)}
const t=term?`Resultados para «${term}»`:NAV.find(n=>n[0]==view)[1].replace(/[\[\]]/g,"");
const e=term?"No hay productos con esa búsqueda.":"Próximamente: estamos subiendo el catálogo de "+t.toLowerCase()+".";
return `<h2>${t}</h2>`+(!term&&SEC[view]?chips():"")+(l.length?`<div class="grid">${l.map(p=>`<article class="c g">${ph(p)}<div class="nm">${p.name}</div><div class="ds">${p.t}</div><div class="row"><span class="pr">${m(p.price)}</span>${p.price==null?`<a ${LK} href="${wa(WA,"Hola, quiero el precio de: "+p.name)}">Consultar</a>`:`${soldOut(p.id)?`<button class="b" disabled style="opacity:.45">Agotado</button>`:`<button class="b" data-size="${p.id}">Size</button>`}`}</div></article>`).join("")}</div>`:`<div class="empty">${e}</div>`)}
const tattoo=()=>`<h2>Tatuajes</h2><p class="nt">Trabajos de referencia: toca una foto para verla grande y escríbenos por WhatsApp para cotizar el tuyo. El precio depende del tamaño y la zona.</p><div class="grid">${TT.map((t,i)=>`<article class="c g"><div class="ph pt"><button class="zb" data-z="${i}" aria-label="Ver ${t.n}"><img class="tp" src="${t.u}" alt="${t.n}" loading="lazy"></button></div><div class="nm">${t.n}</div><div class="ds" style="font-size:20px;line-height:1.2">${t.s}</div><div class="row"><span class="pr">A cotizar</span><a ${LK} href="${wa(WT,"Hola, quiero cotizar el tatuaje: "+t.n)}">Cotizar</a></div></article>`).join("")}</div>`;
function render(){$("#nav").innerHTML=NAV.map(n=>`<button data-v="${n[0]}" class="${view==n[0]&&!term?"on":""}">${n[1]}</button>`).join("");
$("#app").innerHTML=term?list():view=="tatuajes"?tattoo():view=="home"?hero()+tiles():list()}
function go(v){view=v;term="";sub="Todos";$("#q").value="";render();scrollTo(0,0)}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove("on"),2200)}
function pan(id,on){["#drawer","#sheet","#help","#pay"].forEach(s=>$(s).classList.remove("on"));if(on)$(id).classList.add("on");$("#sh").classList.toggle("on",!!on)}
const MAKE_HOOK="https://hook.us2.make.com/ssquv5avz9pppx18exmnn1okrd2fedj8",MAKE_TOKEN="JEMETO1407",STOCK={};
const SHEET_API="https://script.google.com/macros/s/AKfycbx7X2ug6YYs_i159EYN4dBdkE2YR-oMju_sjA9sErXIJihd8fyDWzEsuLQkpGqV5UM/exec";
fetch(SHEET_API).then(r=>r.json()).then(items=>{if(!Array.isArray(items)||!items.length)return;P.length=0;items.forEach(x=>{P.push(x);IMG[x.id]=(x.u&&x.u[0])||"";STOCK[x.id]=x.stock});render()}).catch(()=>{});
const soldOut=id=>STOCK[id]!==undefined&&STOCK[id]<=0;
function sendOrder(){if(!cart.length||MAKE_HOOK.startsWith("PEGAR"))return;const items=cart.map(i=>({id:i.id,qty:i.q}));fetch(MAKE_HOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({order_id:"W"+Date.now(),items_json:JSON.stringify(items),token:MAKE_TOKEN})}).catch(()=>{})}
function add(id,s){if(soldOut(id))return toast("Producto agotado");const c0=cart.find(i=>i.id==id&&i.s==s);if(STOCK[id]!==undefined&&c0&&c0.q>=STOCK[id])return toast("No hay más existencias");const k=cart.find(i=>i.id==id&&i.s==s);k?k.q++:cart.push({id,s,q:1});draw();toast(P.find(p=>p.id==id).name+(s?" ("+s+")":"")+" añadido al carrito")}
const tot=()=>cart.reduce((a,i)=>a+P.find(x=>x.id==i.id).price*i.q,0);
function draw(){$("#cnt").textContent=cart.reduce((a,i)=>a+i.q,0);
$("#items").innerHTML=cart.length?cart.map((i,k)=>{const p=P.find(x=>x.id==i.id);return `<div class="it"><img src="${IMG[p.id]}" alt=""><div><b>${p.name}</b><br><span style="color:var(--mu)">${i.s?"Talla "+i.s:""}</span><div class="q"><button data-mn="${k}" aria-label="Menos">−</button>${i.q}<button data-pl="${k}" aria-label="Más">+</button></div></div><div style="text-align:right">${m(p.price*i.q)}<br><button class="x" data-rm="${k}">Eliminar</button></div></div>`}).join(""):'<div class="empty">Tu carrito está vacío.<br>Elige una talla y añade una prenda.</div>';
$("#tot").innerHTML=cart.length?`<div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>${m(tot())}</span></div><div style="display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:6px 0 8px"><span>Total</span><span>${m(tot())}</span></div><p style="font-size:12px;color:var(--mu);margin:0 0 8px">Pago por transferencia o depósito bancario. El envío se acuerda por WhatsApp.</p><button class="big" data-co>PAGAR</button>`:""}
function payPanel(){const lines=cart.map(i=>{const p=P.find(x=>x.id==i.id);return "• "+p.name+(i.s?" ("+i.s+")":"")+" x"+i.q+" = "+m(p.price*i.q)}).join("\n");
const msg="Hola, quiero pagar mi pedido de STREET FASHION:\n"+lines+"\nTotal: "+m(tot())+"\nAdjunto mi comprobante de pago.";
$("#pay").innerHTML=`<b style="font-size:20px">Pago por transferencia o depósito</b><p style="color:var(--mu);margin:6px 0 10px">Total a pagar: <b style="color:#fff;font-size:20px">${m(tot())}</b></p><div style="background:#26282c;border-radius:10px;padding:12px;line-height:1.7">Banco: <b>${ACC.bank}</b><br>Titular: <b>${ACC.name}</b><br>Cuenta/tarjeta: <b>${ACC.num}</b></div><button class="b" style="margin:10px 0;min-height:40px" data-copy>Copiar número</button><ol style="padding-left:20px;margin:0 0 12px;color:var(--mu);font-size:14px"><li>Haz la transferencia o el depósito por el total.</li><li>Envía tu comprobante por WhatsApp con tu nombre.</li><li>Tu pedido se confirma cuando la tienda verifique el pago.</li></ol><a class="big" style="display:flex;align-items:center;justify-content:center;background:#25D366;text-decoration:none;color:#000" href="${wa(WA,msg)}" target="_blank" rel="noopener">Enviar comprobante por WhatsApp</a><button class="b" style="width:100%;margin-top:8px;min-height:40px" data-done>Ya envié mi comprobante</button><button class="b" style="width:100%;margin-top:8px;min-height:40px" data-back>Volver al carrito</button>`;pan("#pay",1)}
document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
if(d.v)return go(d.v);if(d.i)return toast(d.i);if(d.sub){sub=d.sub;return render()}
if(d.flip){const p=P.find(x=>x.id==d.flip),i=fl[p.id]=((fl[p.id]||0)+1)%p.u.length;t.querySelector("img").src=p.u[i];return}
if(d.z){const x=TT[d.z];$("#sheet").innerHTML=`<img src="${x.u}" alt="${x.n}" style="width:100%;max-height:68vh;object-fit:contain;border-radius:10px;background:#101010"><p style="margin:8px 0 10px"><b>${x.n}</b> <span style="color:var(--mu)">· ${x.s}</span></p><a class="big" style="display:flex;align-items:center;justify-content:center;background:#25D366;text-decoration:none;color:#000" href="${wa(WT,"Hola, quiero cotizar un tatuaje como: "+x.n)}" target="_blank" rel="noopener">Cotizar por WhatsApp</a>`;return pan("#sheet",1)}
if(d.s){const id=t.parentNode.dataset.p;sel[id]=d.s;[...t.parentNode.children].forEach(b=>b.classList.toggle("on",b==t));return}
if(d.add){if(!sel[1])return toast("Elige una talla primero");return add(1,sel[1])}
if(d.size){cur=+d.size;const p=P.find(x=>x.id==cur),o=p.o||SIZES;if(!o.length)return add(cur,"");$("#sheet").innerHTML=`<b style="font-size:18px">${p.name}</b> <span style="color:var(--mu)">${m(p.price)}</span><p style="color:var(--mu);margin:8px 0;font-size:14px">${p.d}</p><p style="margin:10px 0 6px">Elige tu talla</p><div class="sz" data-p="${p.id}" style="gap:10px;margin-bottom:14px">${o.map(s=>`<button data-sh="${s}" style="width:44px;height:44px;font-size:15px" class="${sel[p.id]==s?"on":""}">${s}</button>`).join("")}</div><button class="big" data-shadd>Add to cart</button>`;return pan("#sheet",1)}
if(d.sh){sel[cur]=d.sh;[...t.parentNode.children].forEach(b=>b.classList.toggle("on",b==t));return}
if(d.shadd!==undefined){if(!sel[cur])return toast("Elige una talla primero");add(cur,sel[cur]);return pan()}
if(d.pl){const it=cart[d.pl];if(STOCK[it.id]!==undefined&&it.q>=STOCK[it.id])return toast("No hay más existencias");it.q++}if(d.mn&&--cart[d.mn].q<1)cart.splice(d.mn,1);if(d.rm)cart.splice(d.rm,1);
if(d.pl||d.mn||d.rm)return draw();
if(d.co!==undefined)return payPanel();if(d.back!==undefined)return pan("#drawer",1);
if(d.copy!==undefined){(navigator.clipboard?navigator.clipboard.writeText(ACC.num.replace(/ /g,"")):Promise.reject()).then(()=>toast("Número copiado"),()=>toast("No se pudo copiar; cópialo manualmente"));return}
if(d.done!==undefined){sendOrder();cart=[];draw();pan();return toast("Gracias. Tu pedido se confirma al verificar tu comprobante.")}});
$("#q").addEventListener("input",e=>{term=e.target.value.trim().toLowerCase();render()});
$("#bag").onclick=()=>pan("#drawer",1);$("#x1").onclick=$("#x2").onclick=$("#sh").onclick=()=>pan();
render();draw();
</script></body></html>
